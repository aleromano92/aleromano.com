version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    groups:
      # All security fixes land in a single PR instead of one per package.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Routine bumps: one PR for minor/patch (auto-merged when CI is green),
      # one for majors (left for review).
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
    # Majors blocked UPSTREAM — not skipped by choice. The weekly Dependabot
    # sweep routine re-checks each blocker and removes the entry once it's fixed.
    ignore:
      # @astrojs/check needs TypeScript's programmatic API, which the TS 7
      # native compiler does not ship yet (expected in 7.1).
      # https://github.com/withastro/astro/issues/17268
      - dependency-name: typescript
        versions: [">=7"]
      # Under Vitest 5, Stryker (9 and 10) kills almost no mutants
      # (email-validation.ts: 6% vs 94% on Vitest 4), whatever coverageAnalysis
      # or vitest.related is set to — the mutation gate would silently pass.
      # https://github.com/stryker-mutator/stryker-js/issues/6210
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
